name: Feature request
description: Propose a new feature or an improvement
title: 'feat: '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the use case first. The scaffold keeps zero runtime dependencies by default; a new dependency needs a strong justification.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What limitation did you hit? How do you work around it today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The API or behavior you expect, with example code.
      render: ts
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered and why you rejected them.
  - type: checkboxes
    id: checklist
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and found no duplicate
          required: true
        - label: I understand that a new runtime dependency needs extra justification
          required: true
