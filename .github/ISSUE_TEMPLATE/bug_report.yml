name: Bug report
description: Report a reproducible defect
title: 'bug: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, confirm that: you searched existing issues, you read docs/README.md, and you tried the latest version.
        For security issues use SECURITY.md; do not report them here.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include the full error output.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Steps, code, or a link to a minimal repository.
      render: ts
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version or commit hash.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, and package manager with its version.
    validations:
      required: true
