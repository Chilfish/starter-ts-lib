name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bun run lint:check
      - run: bun run test:coverage
      - run: bun run build

      - name: Verify build output
        run: |
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts
          test -f dist/index.d.cts

  runtime:
    name: Runtime Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Import ESM build
        run: node --input-type=module -e "const m = await import('./dist/index.js'); if (typeof m.one !== 'number') process.exit(1)"

      - name: Import CJS build
        run: node -e "const m = require('./dist/index.cjs'); if (typeof m.one !== 'number') process.exit(1)"
